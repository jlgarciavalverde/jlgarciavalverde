<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="850" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080f"/><stop offset="35%" stop-color="#0c1222"/>
      <stop offset="65%" stop-color="#111833"/><stop offset="100%" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/><stop offset="40%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.9"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="termBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d333b"/><stop offset="100%" stop-color="#1c2128"/>
    </linearGradient>
    <linearGradient id="termBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/><stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/><stop offset="33%" stop-color="#a78bfa"/>
      <stop offset="66%" stop-color="#34d399"/><stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.06"/><stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.04"/><stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="termShadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/></filter>
    <clipPath id="termClip"><rect x="490" y="58" width="340" height="225" rx="0"/></clipPath>
  </defs>

  <rect width="850" height="300" fill="url(#bgGrad)"/>

  <!-- Grid -->
  <g stroke="#58a6ff" stroke-width="0.2" opacity="0.035">
    <line x1="0" y1="50" x2="850" y2="50"/><line x1="0" y1="100" x2="850" y2="100"/><line x1="0" y1="150" x2="850" y2="150"/><line x1="0" y1="200" x2="850" y2="200"/><line x1="0" y1="250" x2="850" y2="250"/>
    <line x1="85" y1="0" x2="85" y2="300"/><line x1="170" y1="0" x2="170" y2="300"/><line x1="255" y1="0" x2="255" y2="300"/><line x1="340" y1="0" x2="340" y2="300"/><line x1="425" y1="0" x2="425" y2="300"/><line x1="510" y1="0" x2="510" y2="300"/><line x1="595" y1="0" x2="595" y2="300"/><line x1="680" y1="0" x2="680" y2="300"/><line x1="765" y1="0" x2="765" y2="300"/>
  </g>

  <!-- Code rain -->
  <g font-family="monospace" opacity="0.07">
    <text x="30" y="-10" font-size="13" fill="#58a6ff">0<animate attributeName="y" values="-10;310" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.12;0" dur="7s" repeatCount="indefinite"/></text>
    <text x="95" y="-20" font-size="11" fill="#34d399">1<animate attributeName="y" values="-20;310" dur="9s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.1;0" dur="9s" begin="2s" repeatCount="indefinite"/></text>
    <text x="175" y="-15" font-size="12" fill="#a78bfa">{<animate attributeName="y" values="-15;310" dur="8s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.1;0" dur="8s" begin="1s" repeatCount="indefinite"/></text>
    <text x="260" y="-10" font-size="10" fill="#58a6ff">}<animate attributeName="y" values="-10;310" dur="10s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.08;0" dur="10s" begin="3s" repeatCount="indefinite"/></text>
    <text x="350" y="-20" font-size="11" fill="#34d399">&lt;<animate attributeName="y" values="-20;310" dur="7.5s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.1;0" dur="7.5s" begin="0.5s" repeatCount="indefinite"/></text>
    <text x="400" y="-15" font-size="13" fill="#a78bfa">/&gt;<animate attributeName="y" values="-15;310" dur="8.5s" begin="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.09;0" dur="8.5s" begin="4s" repeatCount="indefinite"/></text>
    <text x="440" y="-10" font-size="10" fill="#58a6ff">=&gt;<animate attributeName="y" values="-10;310" dur="11s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.08;0" dur="11s" begin="1.5s" repeatCount="indefinite"/></text>
    <text x="60" y="-25" font-size="9" fill="#34d399">fn<animate attributeName="y" values="-25;310" dur="12s" begin="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.07;0" dur="12s" begin="5s" repeatCount="indefinite"/></text>
    <text x="130" y="-10" font-size="10" fill="#a78bfa">;<animate attributeName="y" values="-10;310" dur="6.5s" begin="3.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.09;0" dur="6.5s" begin="3.5s" repeatCount="indefinite"/></text>
    <text x="310" y="-20" font-size="12" fill="#58a6ff">( )<animate attributeName="y" values="-20;310" dur="9.5s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.08;0" dur="9.5s" begin="2.5s" repeatCount="indefinite"/></text>
  </g>

  <!-- Orbs -->
  <circle cx="220" cy="140" r="130" fill="url(#orbGlow)"><animate attributeName="r" values="130;150;130" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="100" r="80" fill="url(#orbGlow2)"><animate attributeName="r" values="80;95;80" dur="5.5s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="650" cy="160" r="100" fill="url(#orbGlow2)"><animate attributeName="r" values="100;115;100" dur="6s" begin="2s" repeatCount="indefinite"/></circle>

  <!-- Particles -->
  <circle cx="70" cy="40" r="1.3" fill="#58a6ff"><animate attributeName="opacity" values="0;0.8;0" dur="3.5s" repeatCount="indefinite"/><animate attributeName="cy" values="40;25;40" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="180" cy="270" r="1" fill="#a78bfa"><animate attributeName="opacity" values="0;0.5;0" dur="5s" begin="1s" repeatCount="indefinite"/><animate attributeName="cy" values="270;255;270" dur="5s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="360" cy="55" r="1.5" fill="#34d399"><animate attributeName="opacity" values="0;0.7;0" dur="4s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="cy" values="55;40;55" dur="4s" begin="0.5s" repeatCount="indefinite"/></circle>
  <circle cx="420" cy="240" r="0.8" fill="#f59e0b"><animate attributeName="opacity" values="0;0.5;0" dur="6s" begin="2s" repeatCount="indefinite"/><animate attributeName="cy" values="240;228;240" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
  <circle cx="140" cy="170" r="1.1" fill="#58a6ff"><animate attributeName="opacity" values="0;0.4;0" dur="4.5s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="cy" values="170;158;170" dur="4.5s" begin="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="130" r="0.9" fill="#a78bfa"><animate attributeName="opacity" values="0;0.5;0" dur="5.5s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="cy" values="130;118;130" dur="5.5s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle cx="50" cy="200" r="0.7" fill="#34d399"><animate attributeName="opacity" values="0;0.4;0" dur="7s" begin="3s" repeatCount="indefinite"/><animate attributeName="cy" values="200;190;200" dur="7s" begin="3s" repeatCount="indefinite"/></circle>
  <circle cx="250" cy="20" r="1" fill="#f59e0b"><animate attributeName="opacity" values="0;0.3;0" dur="6.5s" begin="4s" repeatCount="indefinite"/><animate attributeName="cy" values="20;10;20" dur="6.5s" begin="4s" repeatCount="indefinite"/></circle>

  <!-- NAME -->
  <text x="40" y="68" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" fill="#6e7681" letter-spacing="4.5" opacity="0">HELLO WORLD, I'M<animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.2s" fill="freeze"/></text>
  <text x="40" y="118" font-family="'Segoe UI',system-ui,sans-serif" font-size="46" font-weight="bold" fill="url(#nameGrad)" filter="url(#glow)" opacity="0">José Luis<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.5s" fill="freeze"/></text>
  <text x="40" y="168" font-family="'Segoe UI',system-ui,sans-serif" font-size="46" font-weight="bold" fill="url(#nameGrad)" filter="url(#glow)" opacity="0">García Valverde<animate attributeName="opacity" values="0;1" dur="0.5s" begin="0.8s" fill="freeze"/></text>
  <line x1="40" y1="178" x2="40" y2="178" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round" opacity="0"><animate attributeName="x2" values="40;430" dur="0.7s" begin="1.1s" fill="freeze"/><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.1s" fill="freeze"/></line>
  <text x="40" y="205" font-family="'Segoe UI',system-ui,sans-serif" font-size="15" fill="#8b949e" opacity="0">Backend Software Engineer · Distributed Systems<animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.4s" fill="freeze"/></text>

  <!-- Tags -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="1.7s" fill="freeze"/>
    <rect x="40" y="220" width="92" height="22" rx="11" fill="none" stroke="#34d399" stroke-width="0.7" opacity="0.7"/><text x="86" y="235" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#34d399" text-anchor="middle">Spring Boot</text>
    <rect x="140" y="220" width="66" height="22" rx="11" fill="none" stroke="#58a6ff" stroke-width="0.7" opacity="0.7"/><text x="173" y="235" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#58a6ff" text-anchor="middle">Docker</text>
    <rect x="214" y="220" width="58" height="22" rx="11" fill="none" stroke="#a78bfa" stroke-width="0.7" opacity="0.7"/><text x="243" y="235" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#a78bfa" text-anchor="middle">React</text>
    <rect x="280" y="220" width="76" height="22" rx="11" fill="none" stroke="#34d399" stroke-width="0.7" opacity="0.7"/><text x="318" y="235" font-family="'Segoe UI',system-ui,sans-serif" font-size="10.5" fill="#34d399" text-anchor="middle">MongoDB</text>
  </g>

  <!-- Open to Work pulsing -->
  <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.5s" begin="2s" fill="freeze"/>
    <rect x="40" y="250" width="130" height="24" rx="12" fill="#0d2818" stroke="#3fb950" stroke-width="0.8"/>
    <circle cx="58" cy="262" r="4" fill="#3fb950" opacity="0.3"><animate attributeName="r" values="4;7;4" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.3;0;0.3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="58" cy="262" r="3.5" fill="#3fb950"/>
    <text x="70" y="266" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#3fb950" font-weight="600">Open to Work</text>
  </g>

  <text x="40" y="290" font-family="'Segoe UI',system-ui,sans-serif" font-size="11" fill="#484f58" opacity="0">📍 Murcia, Spain  ·  🎓 Universidad de Murcia  ·  💻 CS '26<animate attributeName="opacity" values="0;0.9" dur="0.5s" begin="2.3s" fill="freeze"/></text>

