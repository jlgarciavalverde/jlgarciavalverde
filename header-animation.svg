    <rect x="488" y="22" width="340" height="32" rx="10" fill="url(#termBar)"/><rect x="488" y="44" width="340" height="10" fill="url(#termBar)"/>
    <circle cx="508" cy="38" r="5" fill="#f85149" opacity="0.85"/><circle cx="524" cy="38" r="5" fill="#d29922" opacity="0.85"/><circle cx="540" cy="38" r="5" fill="#3fb950" opacity="0.85"/>
    <text x="658" y="42" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#6e7681" text-anchor="middle">⚡ about_me.sh</text>
    <line x1="488" y1="54" x2="828" y2="54" stroke="#21262d" stroke-width="1"/>
    <rect x="488" y="54" width="28" height="224" fill="#090d14" opacity="0.5"/>

    <g clip-path="url(#termClip)" font-family="'SF Mono','Fira Code','Cascadia Code',monospace" font-size="12">
      <g fill="#30363d" font-size="10">
        <text x="504" y="75" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.6s" fill="freeze"/>1</text>
        <text x="504" y="95" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.9s" fill="freeze"/>2</text>
        <text x="504" y="115" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.2s" fill="freeze"/>3</text>
        <text x="504" y="135" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.5s" fill="freeze"/>4</text>
        <text x="504" y="155" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.8s" fill="freeze"/>5</text>
        <text x="504" y="175" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.1s" fill="freeze"/>6</text>
        <text x="504" y="195" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.4s" fill="freeze"/>7</text>
        <text x="504" y="215" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.7s" fill="freeze"/>8</text>
        <text x="504" y="235" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="4s" fill="freeze"/>9</text>
        <text x="504" y="255" text-anchor="end" opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="4.3s" fill="freeze"/>10</text>
      </g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.25s" begin="1.6s" fill="freeze"/><text x="515" y="75" fill="#3fb950" font-weight="bold">❯</text><text x="530" y="75" fill="#79c0ff">cat</text><text x="555" y="75" fill="#c9d1d9">about_me.json</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="1.9s" fill="freeze"/><text x="515" y="95" fill="#6e7681">{</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.2s" fill="freeze"/><text x="530" y="115" fill="#ff7b72">"name"</text><text x="576" y="115" fill="#6e7681"> : </text><text x="596" y="115" fill="#a5d6ff">"José Luis"</text><text x="694" y="115" fill="#6e7681">,</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.5s" fill="freeze"/><text x="530" y="135" fill="#ff7b72">"role"</text><text x="576" y="135" fill="#6e7681"> : </text><text x="596" y="135" fill="#a5d6ff">"Backend Eng"</text><text x="706" y="135" fill="#6e7681">,</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="2.8s" fill="freeze"/><text x="530" y="155" fill="#ff7b72">"stack"</text><text x="582" y="155" fill="#6e7681"> : </text><text x="602" y="155" fill="#a5d6ff">"Spring Boot"</text><text x="714" y="155" fill="#6e7681">,</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.1s" fill="freeze"/><text x="530" y="175" fill="#ff7b72">"infra"</text><text x="582" y="175" fill="#6e7681"> : </text><text x="602" y="175" fill="#a5d6ff">"Docker, MQ"</text><text x="706" y="175" fill="#6e7681">,</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.4s" fill="freeze"/><text x="530" y="195" fill="#ff7b72">"db"</text><text x="556" y="195" fill="#6e7681"> : </text><text x="576" y="195" fill="#a5d6ff">"MongoDB"</text><text x="656" y="195" fill="#6e7681">,</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="3.7s" fill="freeze"/><text x="530" y="215" fill="#ff7b72">"front"</text><text x="582" y="215" fill="#6e7681"> : </text><text x="602" y="215" fill="#a5d6ff">"React + TS"</text><text x="706" y="215" fill="#6e7681">,</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="4s" fill="freeze"/><text x="530" y="235" fill="#ff7b72">"status"</text><text x="590" y="235" fill="#6e7681"> : </text><text x="610" y="235" fill="#3fb950">"Hiring? 🚀"</text></g>
      <g opacity="0"><animate attributeName="opacity" values="0;1" dur="0.2s" begin="4.3s" fill="freeze"/><text x="515" y="255" fill="#6e7681">}</text></g>
      <rect x="528" y="262" width="7" height="13" fill="#58a6ff" opacity="0"><animate attributeName="opacity" values="0;0;1;1" dur="1.1s" begin="4.5s" repeatCount="indefinite"/></rect>
    </g>
    <rect x="488" y="268" width="340" height="10" fill="#161b22"/>
    <rect x="488" y="272" width="340" height="6" rx="5" fill="#161b22"/>
    <text x="498" y="276" font-family="monospace" font-size="8" fill="#30363d">UTF-8 · JSON · LF</text>
    <text x="818" y="276" font-family="monospace" font-size="8" fill="#30363d" text-anchor="end">Ln 10, Col 1</text>
  </g>

  <!-- Floating symbols -->
  <text x="458" y="60" font-family="monospace" font-size="20" fill="#58a6ff" opacity="0.06">{ }<animateTransform attributeName="transform" type="translate" values="0,0;0,-14;0,0" dur="5s" repeatCount="indefinite"/></text>
  <text x="450" y="150" font-family="monospace" font-size="15" fill="#a78bfa" opacity="0.05">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0,0;5,-10;0,0" dur="6.5s" begin="1s" repeatCount="indefinite"/></text>
  <text x="465" y="230" font-family="monospace" font-size="13" fill="#34d399" opacity="0.05">=&gt;<animateTransform attributeName="transform" type="translate" values="0,0;-4,-7;0,0" dur="5s" begin="2s" repeatCount="indefinite"/></text>

  <rect x="0" y="296" width="850" height="4" fill="url(#accentLine)" opacity="0.7"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/></rect>
</svg>
